name: CI/CD

# Trunk-based:PR 與 main 只跑測試;只有 Release(vX.Y.Z tag)才 build image 推 GHCR,tag 原樣就是 image tag。
# 部署在目標主機 make deploy,詳見 docs/deployment.md。
on:
  push:
    branches: [main]
    # 只認 Release 的形狀:「是 tag 就 build」的話,latest、wip 這類 tag 也會變成 image
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

# 同一個 ref 一次只跑一條;PR 的新 commit 直接取消舊 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 跑在 backend dev stage 容器裡,與本機 make test 同一套環境
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target dev -t backend-test backend
      - run: docker run --rm backend-test ruff check .
      - run: docker run --rm backend-test ruff format --check .
      - run: docker run --rm backend-test pytest -q

  # 前端只驗 build 得過
  test-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build frontend

  # 只有 Release 會產生 image;不指定 target,Docker 建最後一個 stage(runtime)。
  # 同時 build amd64 與 arm64:arm64 那半在 amd64 runner 上用 QEMU 模擬,慢幾分鐘,只在 Release 時付
  build:
    needs: [test-backend, test-frontend-build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      # QEMU 讓 runner 跑得動 arm64 的 build;多架構的輸出要 buildx 的 container driver,預設的 docker driver 不支援
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # --push 直接推成一個含兩個架構的 manifest;docker pull 會自動挑主機的架構
      - run: |
          for svc in backend frontend; do
            docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$IMAGE-$svc:$TAG" "$svc"
          done
      # 部署指令印在 run summary,tag 直接填好省得回頭查
      - run: |
          {
            echo "### 部署 $TAG"
            echo "在目標主機上執行:"
            echo '```bash'
            echo "make deploy ENV=<dev|qas|prd> TAG=$TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
