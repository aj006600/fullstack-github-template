# 本機開發 override:make dev → localhost:3000 / :8000,後端 hot reload。
# 撞埠(例如另一個 worktree 也在跑 make dev)時從 shell 換:PORT=8001 FRONTEND_PORT=3001 make dev
services:
  backend:
    build:
      context: ./backend
      target: dev            # dev stage 含 pytest/ruff;啟動指令(--reload)由該 stage 的 CMD 提供
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    ports:
      - "${PORT:-8000}:8000"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:80"
