# 這個檔以 conf.d/default.conf 被映像的 /etc/nginx/nginx.conf include 進 http 區塊，
# 所以 log_format 必須寫在檔案頂端（server 之外）。
# 內容 = 映像預設的 main 格式 + 行尾 $request_id：維持文字格式，操作者拿 id 直接 grep。
log_format main_request_id '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" $request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log main_request_id;

    # SPA：找不到的路徑回 index.html，交給前端路由
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        # 必須用 resolver + 變數形式：字面 hostname 只在啟動時解析一次並永久快取，
        # backend 單獨重建換 IP 後會持續 502（實測）；變數形式讓 nginx 依 TTL 重新解析
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        # 沒有這些標頭，backend 只看得到 nginx 的容器 IP；X-Forwarded-Proto 供日後 TLS 判斷原始協定
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Request ID 在這一跳產生（定義見 CONTEXT.md「Observability」）。
        # proxy_set_header 會覆蓋瀏覽器自帶的值，backend「有就沿用」的規則因此在部署下是安全的。
        # always：nginx 自己回的 502（backend 沒回應）也要帶 id，否則最需要查的那種失敗反而查不到。
        # hide：backend 也會回同一個 id，不藏會出現兩個同值 header，fetch 的 headers.get 會拿到 "id, id"。
        proxy_set_header  X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header        X-Request-ID $request_id always;
    }
}
